<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="DeutschWelt Grammatik – deutsche Grammatik einfach und verständlich für A1, A2, B1 und B2."
    >

    <title>
        Grammatik – DeutschWelt
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<header class="site-header">

    <div class="header-inner">


        <a
            href="index.html"
            class="logo"
            aria-label="DeutschWelt Startseite"
        >

            <span
                class="logo-icon"
                aria-hidden="true"
            >
                🇩🇪
            </span>

            <span>
                DeutschWelt
            </span>

        </a>


        <nav
            class="main-nav"
            aria-label="Hauptnavigation"
        >

            <a href="index.html">
                Startseite
            </a>

            <a href="lernen.html?level=A1">
                Lernwelten
            </a>

            <a href="wortschatz.html">
                Wortschatz
            </a>

            <a
                href="grammatik.html"
                class="active"
                aria-current="page"
            >
                Grammatik
            </a>

        </nav>


    </div>

</header>



<main class="learning-page">


    <section
        class="level-header"
        aria-labelledby="grammarTitle"
    >

        <span class="eyebrow">
            DeutschWelt
        </span>


        <h1 id="grammarTitle">
            Grammatik
        </h1>


        <p>
            Deutsche Grammatik einfach und
            verständlich erklärt.
        </p>

    </section>



    <section
        class="level-filter"
        aria-label="Sprachniveau auswählen"
    >

        <button
            type="button"
            class="filter-level active"
            data-grammar-level="A1"
            aria-pressed="true"
        >
            A1
        </button>

        <button
            type="button"
            class="filter-level"
            data-grammar-level="A2"
            aria-pressed="false"
        >
            A2
        </button>

        <button
            type="button"
            class="filter-level"
            data-grammar-level="B1"
            aria-pressed="false"
        >
            B1
        </button>

        <button
            type="button"
            class="filter-level"
            data-grammar-level="B2"
            aria-pressed="false"
        >
            B2
        </button>

    </section>



    <section
        id="grammarGrid"
        aria-live="polite"
        aria-label="Grammatikthemen"
    >

        <div class="loading-message">

            <div class="loading-spinner"></div>

            <span>
                Grammatik wird geladen ...
            </span>

        </div>

    </section>


</main>



<footer class="site-footer">

    <div class="footer-inner">

        <div>

            <strong>
                DeutschWelt
            </strong>

            <p>
                Deutsch verstehen. Deutsch anwenden.
            </p>

        </div>


        <div>

            <p>
                © 2026 DeutschWelt
            </p>

        </div>

    </div>

</footer>



<script src="script.js"></script>


</body>

</html>
